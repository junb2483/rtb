<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ID lỗi</title>
    <style>
      :root {
        --blue: #2563eb;
        --blue-dark: #1d4ed8;
        --ink: #0f172a;
        --ink-soft: #475569;
        --ink-faint: #94a3b8;
        --line: #e2e8f0;
        --card: #ffffff;
        --danger: #e11d48;
        --danger-dark: #be123c;
        --radius: 16px;
      }

      * { -webkit-tap-highlight-color: transparent; }

      html, body { height: 100%; margin: 0; padding: 0; }

      body {
        -webkit-text-size-adjust: 100%;
        /* nền chuyển sắc: xanh rất nhạt trên đỉnh, tan dần xuống trắng */
        background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 38%, #f8fafc 100%);
        background-attachment: fixed;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-y: auto;
      }

      .wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 28px 16px 40px;
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
      }

      .container {
        width: 100%;
        max-width: 520px;
        padding: 22px 20px 24px;
        background-color: var(--card);
        border-radius: var(--radius);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.04),
          0 12px 32px -8px rgba(15, 23, 42, 0.16);
      }

      .title {
        margin: 0;
        text-align: center;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      .title::before {
        content: "◈";
        color: var(--blue);
        margin-right: 8px;
        font-size: 1.1rem;
        vertical-align: 2px;
      }

      .subtitle {
        text-align: center;
        font-size: 0.85rem;
        color: var(--ink-faint);
        margin: 6px 0 20px;
      }

      .note { font-size: 0.85rem; color: var(--ink-faint); margin: 10px 0 0; font-style: italic; }
      .note-important { font-size: 0.85rem; color: var(--danger); margin: 12px 0 0; }
      .note-link { font-size: 0.85rem; color: var(--ink-soft); text-align: center; margin-top: 16px; }
      .note-link a { color: var(--blue); text-decoration: none; font-weight: 600; }
      /* --- thanh chọn tất cả --- */
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 10px;
      }

      .toolbar label {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--ink-soft);
        cursor: pointer;
        margin: 0;
        user-select: none;
      }

      .toolbar .counter { font-size: 0.8rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

      /* --- danh sách id --- */
      .id-list {
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      .id-row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 12px;
        border-bottom: 1px solid #f1f5f9;
        background-color: var(--card);
        transition: background-color 0.15s ease;
      }

      .id-row:last-child { border-bottom: none; }      .id-row.picked { background-color: #eff6ff; }

      .id-row input[type="checkbox"] {
        margin: 1px 0 0;
        width: 19px;
        height: 19px;
        flex: 0 0 auto;
        accent-color: var(--blue);
        cursor: pointer;
      }

      .id-body { flex: 1; min-width: 0; }

      .id-name {
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--ink);
        text-decoration: none;
        word-break: break-all;
      }

      /* nhãn lỗi dạng viên, mỗi loại một màu */
      .id-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        padding: 3px 10px 3px 8px;
        border-radius: 999px;
        font-size: 0.76rem;
        font-weight: 600;
        line-height: 1.5;
      }

      .id-label::before {
        content: "⬤";
        font-size: 0.5rem;
        line-height: 1;
      }

      .lb-private { background: #ffe4e6; color: #9f1239; }
      .lb-hidden  { background: #ffedd5; color: #9a3412; }
      .lb-few     { background: #fef9c3; color: #854d0e; }
      .lb-gone    { background: #e2e8f0; color: #334155; }
      .lb-other   { background: #ede9fe; color: #5b21b6; }

      .empty {
        text-align: center;
        padding: 32px 12px;
        color: #15803d;
        font-weight: 600;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 12px;
      }

      /* --- nút xoá --- */
      .actions { margin-top: 18px; }

      .deleteButton {
        width: 100%;
        padding: 14px 20px;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        box-sizing: border-box;
        font-weight: 700;
        font-size: 1rem;
        font-family: inherit;
        color: white;
        background: linear-gradient(180deg, var(--danger) 0%, var(--danger-dark) 100%);
        box-shadow: 0 4px 14px -4px rgba(225, 29, 72, 0.55);
        transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
      }
      .deleteButton:active:not(:disabled) { transform: translateY(1px); }

      .deleteButton:disabled {
        background: #e2e8f0;
        color: var(--ink-faint);
        box-shadow: none;
        cursor: not-allowed;
      }

      .result {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 0.88rem;
        line-height: 1.5;
        display: none;
      }

      .result.ok { display: block; background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
      .result.fail { display: block; background: #fff1f2; border: 1px solid #fecdd3; color: var(--danger-dark); }

      /* --- modal mật khẩu --- */
      .password-modal {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        z-index: 100000;
        justify-content: center;
        align-items: center;
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      .password-modal.show { opacity: 1; visibility: visible; }

      .password-modal-content {
        background: var(--card);
        border-radius: var(--radius);
        width: 340px;
        max-width: calc(100vw - 32px);
        box-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.45);
        text-align: left;
        animation: fadeIn 0.25s ease;
        box-sizing: border-box;
        padding: 22px;
      }

      .password-modal-content label {
        font-weight: 700;
        font-size: 0.95rem;
        display: block;
        color: var(--ink);
      }

      .password-modal-content input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-sizing: border-box;
        margin-top: 10px;
        font-size: 16px;
        font-family: inherit;
        color: var(--ink);
        background: #f8fafc;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }

      .password-modal-content input:focus {
        outline: none;
        background: var(--card);
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
      }

      .password-modal-buttons { display: flex; gap: 10px; margin-top: 16px; }

      .password-modal-buttons button {
        flex: 1;
        padding: 11px;
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .btn-password-submit { background: var(--blue); color: white; }      .btn-password-cancel { background: #f1f5f9; color: var(--ink-soft); }
      .password-error { color: var(--danger); font-size: 0.82rem; margin-top: 10px; display: none; }

      .loading-overlay {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #dbeafe 0%, #f8fafc 100%);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        flex-direction: column;
      }

      .loading-message { font-size: 1.2rem; font-weight: 700; color: var(--blue); text-align: center; }


      /* ===== phần thêm cho bố cục mới ===== */

      /* đầu trang dính lại khi cuộn: tên bot + tình trạng + chip lọc luôn trong tầm mắt */
      .sheet-head {
        position: sticky;
        top: 0;
        z-index: 800;
        background: var(--card);
        margin: -22px -20px 14px;
        padding: 16px 20px 12px;
        border-radius: var(--radius) var(--radius) 0 0;
        border-bottom: 1px solid var(--line);
      }

      .sheet-head .title { font-size: 1.3rem; }
      .sheet-head .subtitle { margin: 4px 0 0; }

      .chips {
        display: flex;
        gap: 7px;
        margin-top: 12px;
        overflow-x: auto;
        scrollbar-width: none;
        padding-bottom: 2px;
      }
      .chips::-webkit-scrollbar { display: none; }

      .chip {
        flex: 0 0 auto;
        min-height: 44px;
        padding: 6px 15px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #f8fafc;
        color: var(--ink-soft);
        font: 600 0.8rem/1.4 inherit;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .chip.on {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }

      .chip.lb-private.on { background: #9f1239; border-color: #9f1239; }
      .chip.lb-hidden.on  { background: #9a3412; border-color: #9a3412; }
      .chip.lb-few.on     { background: #854d0e; border-color: #854d0e; }
      .chip.lb-gone.on    { background: #334155; border-color: #334155; }
      .chip.lb-other.on   { background: #5b21b6; border-color: #5b21b6; }

      /* cả hàng là vùng chạm, ô tick chỉ để nhìn */
      .id-row { cursor: pointer; min-height: 56px; align-items: center; }
      .id-row input[type="checkbox"] { pointer-events: none; }

      .id-name { font-weight: 600; font-size: 0.95rem; color: var(--ink); word-break: break-all; }

      .id-open {
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        color: var(--ink-faint);
        text-decoration: none;
        font-size: 1.05rem;
      }
      .load-more {
        width: 100%;
        margin-top: 10px;
        padding: 12px;
        border: 1px dashed var(--line);
        border-radius: 10px;
        background: #f8fafc;
        color: var(--ink-soft);
        font: 600 0.88rem/1.4 inherit;
        cursor: pointer;
      }
      /* thanh hành động dính đáy — ngón cái luôn với tới, danh sách dài cỡ nào cũng xoá được */
      .actionbar {
        position: sticky;
        bottom: 0;
        z-index: 800;
        margin: 16px -20px -24px;
        padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid var(--line);
        border-radius: 0 0 var(--radius) var(--radius);
      }

      .sel-info {
        font-size: 0.82rem;
        color: var(--ink-soft);
        margin-bottom: 9px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      /* khối xem trước trong modal xác nhận xoá */
      .confirm-body { display: none; margin-bottom: 14px; }

      .confirm-ids {
        max-height: 118px;
        overflow-y: auto;
        padding: 10px 12px;
        background: #f8fafc;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-size: 0.84rem;
        line-height: 1.6;
        color: var(--ink-soft);
        word-break: break-all;
      }

      .confirm-note { margin-top: 9px; font-size: 0.84rem; color: var(--danger); }
      .confirm-body + label { margin-top: 4px; }

      .copy-btn {
        margin-top: 10px;
        width: 100%;
        padding: 10px;
        border: 1px solid currentColor;
        border-radius: 10px;
        background: transparent;
        color: inherit;
        font: 600 0.85rem/1.4 inherit;
        cursor: pointer;
      }

      .copy-fallback {
        margin-top: 8px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.7);
        border-radius: 8px;
        font-size: 0.8rem;
        word-break: break-all;
        user-select: all;
      }


      /* Chỉ áp hover cho chuột: trên điện thoại hover DÍNH lại sau khi chạm,
         nút cứ sáng mãi làm khách tưởng đang chọn. */
      @media (hover: hover) {
  .note-link a:hover { text-decoration: underline; }
  .id-row:hover { background-color: #f8fbff; }
  .id-name:hover { color: var(--blue); text-decoration: underline; }
  .deleteButton:hover:not(:disabled) { box-shadow: 0 6px 18px -4px rgba(225, 29, 72, 0.65); }
  .btn-password-submit:hover { background: var(--blue-dark); }
  .btn-password-cancel:hover { background: var(--line); }
  .id-open:hover { background: #eff6ff; color: var(--blue); }
  .load-more:hover { border-color: var(--blue); color: var(--blue); }
      }

      /* Bàn phím ảo bật lên, trình duyệt cuộn ô đang gõ vào tầm nhìn — chừa sẵn chỗ để nó
         không nằm khuất sau thanh hành động dính đáy. */
      input, textarea { scroll-margin-bottom: 130px; }

      /* Màn hình hẹp (iPhone SE 375px, Zenfone 360px): bớt lề để nội dung rộng ra. */
      @media (max-width: 420px) {
        .wrapper { padding: 14px 10px 28px; }
        .container { padding: 18px 14px 20px; border-radius: 14px; }
        .sheet-head { margin: -18px -14px 14px; padding: 14px 14px 10px; }
        .actionbar { margin: 16px -14px -20px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); }
        .title { font-size: 1.2rem; }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="password-modal" class="password-modal">
      <div class="password-modal-content">
        <div id="confirm-body" class="confirm-body"></div>
        <label id="password-label">Nhập mật khẩu: </label>
        <input type="password" id="password" placeholder="Mật khẩu" autocomplete="off" />
        <div id="password-error" class="password-error"></div>
        <div class="password-modal-buttons">
          <button id="btn-password-cancel" class="btn-password-cancel">Đóng</button>
          <button id="btn-password-submit" class="btn-password-submit">Xác nhận</button>
        </div>
      </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
      <div id="loading-message" class="loading-message">Đang tải dữ liệu ...</div>
    </div>

    <div class="wrapper" id="wrapper">
      <div class="container" id="main" style="display: none">
        <div class="sheet-head">
          <h2 class="title" id="bot-name">ID lỗi</h2>
          <p class="subtitle" id="meta"></p>
          <div class="chips" id="filter-chips"></div>
        </div>

        <div id="has-errors" style="display: none">
          <div class="toolbar">
            <label>
              <input type="checkbox" id="check-all" />
              <span id="check-all-label">Chọn tất cả</span>
            </label>
            <span class="counter" id="counter"></span>
          </div>

          <div class="id-list" id="id-list"></div>
          <button type="button" id="load-more" class="load-more" style="display: none"></button>

          <p class="note">Xóa ở trang này bot <b>KHÔNG</b> khởi động lại — danh sách quét tự cập nhật sau khoảng 30 giây.</p>
        </div>

        <div id="no-errors" class="empty" style="display: none">
          ✅ Không có id nào bị lỗi.
        </div>

        <div id="result" class="result"></div>

        <p class="note-link">
          Xem toàn bộ cấu hình tại
          <a id="config-link" href="https://i.junb.io.vn/bot-config" target="_blank">bot-config</a>
        </p>
      </div>

      <div class="actionbar" id="actionbar" style="display: none">
        <div class="actionbar-inner">
          <div class="sel-info" id="sel-info">Chưa chọn id nào</div>
          <button class="deleteButton" id="delete-button" disabled>Xóa 0 ids</button>
        </div>
      </div>
    </div>
