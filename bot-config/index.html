<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Bot Config</title>
    <style>
      :root {
        --blue: #2563eb;
        --blue-dark: #1d4ed8;
        --ink: #0f172a;
        --ink-soft: #475569;
        --ink-faint: #94a3b8;
        --line: #e2e8f0;
        --card: #ffffff;
        --danger: #e11d48;
        --radius: 16px;
        --primary-color: #2563eb;
        --error-color: #e11d48;
      }

      * { -webkit-tap-highlight-color: transparent; }

      html, body { height: 100%; margin: 0; padding: 0; }

      body {
        -webkit-text-size-adjust: 100%;
        background: linear-gradient(180deg, #dbeafe 0%, #eff6ff 38%, #f8fafc 100%);
        background-attachment: fixed;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-y: auto;
      }

      .wrapper {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 28px 16px 40px;
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
      }

      .container {
        width: 100%;
        max-width: 520px;
        padding: 22px 20px 24px;
        background-color: var(--card);
        border-radius: var(--radius);
        border: 1px solid rgba(148, 163, 184, 0.18);
        box-shadow:
          0 1px 2px rgba(15, 23, 42, 0.04),
          0 12px 32px -8px rgba(15, 23, 42, 0.16);
      }

      .title {
        margin: 0 0 18px;
        text-align: center;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      .title::before {
        content: "◈";
        color: var(--blue);
        margin-right: 8px;
        font-size: 1.1rem;
        vertical-align: 2px;
      }

      .field { margin-bottom: 14px; }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 0.88rem;
        color: var(--ink-soft);
      }

      input[type="text"],
      textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-sizing: border-box;
        font-size: 16px;
        font-family: inherit;
        background-color: #f8fafc;
        color: var(--ink);
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }

      textarea { line-height: 1.55; resize: vertical; }

      textarea::placeholder,
      input::placeholder { color: var(--ink-faint); }

      input:focus,
      textarea:focus {
        outline: none;
        background-color: var(--card);
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--blue);
        cursor: pointer;
        margin: 0;
      }

      input[type="radio"] { accent-color: var(--blue); }

       
      .field label[style*="flex"] {
        margin-bottom: 0;
        font-size: 0.9rem;
        color: var(--ink);
        cursor: pointer;
        user-select: none;
      }

      .error {
        color: var(--error-color);
        font-size: 0.8rem;
        margin-top: 6px;
        text-align: left;
      }

      .loading-overlay {
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #dbeafe 0%, #f8fafc 100%);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        flex-direction: column;
        padding: 24px;
        box-sizing: border-box;
      }

      .loading-message {
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--blue);
        text-align: center;
      }

      .note {
        font-size: 0.85rem;
        color: var(--ink-faint);
        margin: 10px 0 0;
        font-style: italic;
        text-align: center;
      }

      .note-link { font-size: 0.85rem; color: var(--ink-soft); text-align: center; margin-top: 14px; }

       
      .restartButton,
      .saveButton {
        padding: 13px 20px;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        box-sizing: border-box;
        font-weight: 700;
        font-size: 0.98rem;
        font-family: inherit;
        color: white;
        transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      .restartButton:active,
      .saveButton:active { transform: translateY(1px); }

      .restartButton {
        background: linear-gradient(180deg, #f43f5e 0%, #be123c 100%);
        box-shadow: 0 4px 14px -4px rgba(225, 29, 72, 0.5);
        width: 62%;
      }

      .saveButton {
        background: linear-gradient(180deg, #3b82f6 0%, var(--blue-dark) 100%);
        box-shadow: 0 4px 14px -4px rgba(37, 99, 235, 0.5);
        width: 36%;
      }

      .restartButton:disabled,
      .saveButton:disabled {
        background: #e2e8f0;
        color: var(--ink-faint);
        box-shadow: none;
        cursor: not-allowed;
      }

       
      .password-modal {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        z-index: 100000;
        justify-content: center;
        align-items: center;
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, visibility 0.25s ease;
      }

      .password-modal.show { opacity: 1; visibility: visible; }

      .password-modal-content {
        background: var(--card);
        border-radius: var(--radius);
        width: 340px;
        max-width: calc(100vw - 32px);
        box-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.45);
        text-align: left;
        animation: fadeIn 0.25s ease;
        box-sizing: border-box;
        padding: 22px;
      }

      .password-modal-content label {
        font-weight: 700;
        font-size: 0.95rem;
        display: block;
        color: var(--ink);
        margin-bottom: 0;
      }

      .password-modal-content input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-sizing: border-box;
        margin-top: 10px;
        font-size: 16px;
      }

      .password-modal-buttons { display: flex; gap: 10px; margin-top: 16px; }

      .password-modal-buttons button {
        flex: 1;
        padding: 11px;
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .btn-password-submit { background: var(--blue); color: white; }      .btn-password-cancel { background: #f1f5f9; color: var(--ink-soft); }

       
      .sheet-head {
        position: sticky;
        top: 0;
        z-index: 800;
        background: var(--card);
        margin: -22px -20px 16px;
        padding: 16px 20px 12px;
        border-radius: var(--radius) var(--radius) 0 0;
        border-bottom: 1px solid var(--line);
      }
      .sheet-head .title { margin: 0; font-size: 1.35rem; }
      .subtitle { text-align: center; font-size: 0.82rem; color: var(--ink-faint); margin: 5px 0 0; }

       
      .sect-head {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin: 20px 0 10px;
        padding-bottom: 7px;
        border-bottom: 1px solid var(--line);
      }
      .form-content > .sect-head:first-child { margin-top: 0; }

      .count-pill {
        float: right;
        font-weight: 700;
        font-size: 0.76rem;
        color: var(--blue);
        background: #eff6ff;
        border-radius: 999px;
        padding: 2px 9px;
        font-variant-numeric: tabular-nums;
      }
      .count-pill.over { color: #9f1239; background: #ffe4e6; }

       
      .actionbar {
        position: sticky;
        bottom: 0;
        z-index: 800;
        margin: 18px -20px -24px;
        padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-top: 1px solid var(--line);
        border-radius: 0 0 var(--radius) var(--radius);
      }

      .actionbar-row { display: flex; gap: 10px; align-items: stretch; }

       
      .saveButton { flex: 1; width: auto; }

      .restartButton {
        width: auto;
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        padding: 8px 14px;
        background: var(--card);
        color: var(--danger);
        border: 1px solid #fecdd3;
        box-shadow: none;
      }      .restart-ico { font-size: 1.05rem; line-height: 1; }
      .restart-txt { font-size: 0.62rem; font-weight: 600; line-height: 1; }

      .save-status {
        display: none;
        margin-bottom: 10px;
        padding: 9px 12px;
        border-radius: 10px;
        font-size: 0.84rem;
        line-height: 1.45;
      }
      .save-status.ok { display: block; background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
      .save-status.warn { display: block; background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
      .save-status.fail { display: block; background: #fff1f2; border: 1px solid #fecdd3; color: #be123c; }


       
      @media (hover: hover) {
  .btn-password-submit:hover { background: var(--blue-dark); }
  .btn-password-cancel:hover { background: var(--line); }
  .restartButton:hover { background: #fff1f2; }
      }

       
      input, textarea { scroll-margin-bottom: 130px; }

       
      @media (max-width: 420px) {
        .wrapper { padding: 14px 10px 28px; }
        .container { padding: 18px 14px 20px; border-radius: 14px; }
        .sheet-head { margin: -18px -14px 14px; padding: 14px 14px 10px; }
        .actionbar { margin: 16px -14px -20px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); }
        .title { font-size: 1.2rem; }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="password-modal" class="password-modal">
      <div class="password-modal-content">
        <label>Nhập mật khẩu: </label>
        <input type="password" id="password" placeholder="Mật khẩu" autocomplete="off" />
        <div class="password-modal-buttons">
          <button id="btn-password-cancel" class="btn-password-cancel">
            Đóng
          </button>
          <button id="btn-password-submit" class="btn-password-submit">
            Xác nhận
          </button>
        </div>
      </div>
    </div>

    <div id="loading-overlay" class="loading-overlay">
      <div id="loading-message" class="loading-message">
        Đang tải dữ liệu ...
      </div>
      <p class="note">
        <i>
          "🔥 Tạo bot, liên hệ telegram
          <a
            href="https://t.me/cp_junb_bot_2483"
            style="color: #007bff; font-weight: bold; margin-bottom: 10px"
            >JunB</a
          >, giá công khai
          <a
            href="https://i.junb.io.vn"
            style="color: #007bff; font-weight: bold; margin-bottom: 10px"
            >tại đây</a
          >
          !"
        </i>
      </p>
      <p class="note">"Những thay đổi cần khoảng 1 phút để bot tiếp nhận"</p>
    </div>
    <div class="wrapper" id="wrapper">
      <div class="container">
        <div class="sheet-head">
          <h2 id="bot-title" class="title">Bot Config</h2>
          <p class="subtitle">Chỉnh xong nhớ bấm Lưu — bot nhận sau khoảng 1 phút</p>
        </div>

        <div class="form-content">
          <div class="sect-head" style="display: flex; justify-content: space-between; align-items: center">
            <span>1 · Mô tả nhóm</span>
            <span class="count-pill" id="sub_name_count" style="letter-spacing: normal; margin: -3px 0"></span>
          </div>
          <div class="field" id="div_sub_name">
            <input type="text" id="sub_name" name="sub_name" autocomplete="off" placeholder="VD: Rương 20/16" />
            <div id="sub_name_error" class="error"></div>
          </div>

          <div class="sect-head">2 · Bot nhặt gì</div>
          <div class="field" style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px 0">
            <div style="display: flex; align-items: center">
              <label
                style="display: flex; align-items: center; margin-right: 10px"
              >
                <input type="checkbox" id="bag" name="mode" value="BAG" autocomplete="off" />
                <span style="line-height: 1; margin-left: 3px">🟪 Túi</span>
              </label>

              <label
                style="display: flex; align-items: center; margin-right: 10px"
              >
                <input type="checkbox" id="box" name="mode" value="BOX" autocomplete="off" />
                <span style="line-height: 1; margin-left: 3px">🎁 Rương</span>
              </label>

              <label style="display: flex; align-items: center">
                <input type="checkbox" id="filter_type" name="filter_type" autocomplete="off" />
                <span style="line-height: 1; margin-left: 3px">Nâng cao</span>
              </label>
            </div>
          </div>

          <div class="sect-head">3 · Điều kiện gửi</div>
          <div id="levelField" class="field">
            <label for="min_level">Gửi khi level nhỏ hơn/bằng:</label>
            <input type="text" id="min_level" name="min_level" autocomplete="off" inputmode="numeric" />
            <div id="max_level_error" class="error"></div>
          </div>

          <div id="minCoinsField" class="field">
            <label for="min_coins">Gửi khi có xu tối thiểu:</label>
            <input type="text" id="min_coins" name="min_coins" autocomplete="off" inputmode="numeric" />
            <div id="min_coins_error" class="error"></div>
          </div>
          <div id="minRateField" class="field">
            <label for="min_rate">Tỷ lệ tối thiểu (Số xu/Số người):</label>
            <input type="text" id="min_rate" name="min_rate" autocomplete="off" />
            <div id="min_rate_error" class="error"></div>
          </div>
          <div id="minSecsField" class="field">
            <label for="min_secs">Gửi khi thời gian nhỏ hơn (giây):</label>
            <input type="text" id="min_secs" name="min_secs" autocomplete="off" inputmode="numeric" />
            <div id="min_secs_error" class="error"></div>
          </div>

          <div id="filterQueryField" class="field">
            <div class="sect-head">4 · Mã lọc nâng cao</div>
            <label id="filter_query_label" for="filter_query"
              >Mã rương thông thường:</label
            >
            <textarea
              id="filter_query"
              name="filter_query"
              rows="2"
              placeholder="@IS_BAG, @IS_BOX, @TIME, @RATE, @IS_GOLDEN_BOX, @IS_CLOVER_BOX, @VIEWERS, @COINS, @LEVEL, @RECEIVERS, @HOURS"
              oninput="this.value = this.value.toUpperCase()"
            ></textarea>
            <div id="filter_query_error" class="error"></div>
          </div>

          <div id="filterSpecialQueryField" class="field">
            <label id="filter_special_query_label" for="filter_special_query"
              >Mã rương tiềm năng:</label
            >
            <textarea
              id="filter_special_query"
              name="filter_special_query"
              rows="2"
              placeholder="@IS_BAG, @IS_BOX, @TIME, @RATE, @IS_GOLDEN_BOX, @IS_CLOVER_BOX, @VIEWERS, @COINS, @LEVEL, @RECEIVERS, @HOURS"
              oninput="this.value = this.value.toUpperCase()"
            ></textarea>
            <div id="filter_special_query_error" class="error"></div>
          </div>

          <div
            id="boxTypesField"
            class="field"
            style="
              display: flex;
              flex-wrap: wrap;
              align-items: center;
              padding-bottom: 0;
              padding-top: 5px;
              margin-bottom: 7px;
              margin-top: -5px;
            "
          >
            <div
              style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-bottom: 6px"
            >
              <label style="display: flex; align-items: center; white-space: nowrap">
                <input
                  type="checkbox"
                  id="use_golden_box"
                  name="use_golden_box"
                  value="1"
                  autocomplete="off"
                />
                <span style="line-height: 1">🟡</span>
                <span style="line-height: 1; margin-left: 2px">Rương vàng</span>
              </label>

              <label style="display: flex; align-items: center; white-space: nowrap">
                <input
                  type="checkbox"
                  id="use_clover_box"
                  name="use_clover_box"
                  value="1"
                  autocomplete="off"
                />
                <span style="line-height: 1">🍀</span>
                <span style="line-height: 1; margin-left: 2px">Rương cỏ</span>
              </label>

              <label style="display: flex; align-items: center; white-space: nowrap">
                <input
                  type="checkbox"
                  id="use_hang_box"
                  name="use_hang_box"
                  value="1"
                  autocomplete="off"
                />
                <span style="line-height: 1">🧤</span>
                <span style="line-height: 1; margin-left: 2px">Rương treo</span>
              </label>
            </div>

            <div
              style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px"
            >
              <label style="display: flex; align-items: center; white-space: nowrap">
                <input
                  type="checkbox"
                  id="use_only_hang_box"
                  name="use_only_hang_box"
                  value="1"
                  autocomplete="off"
                />
                <span style="line-height: 1">🧤</span>
                <span style="line-height: 1; margin-left: 2px"
                  >Chỉ gửi rương treo</span
                >
              </label>

              <label style="display: flex; align-items: center; white-space: nowrap">
                <input
                  type="checkbox"
                  id="skip_golden_hang_box"
                  name="skip_golden_hang_box"
                  value="1"
                  autocomplete="off"
                />
                <span style="line-height: 1">🟡</span>
                <span style="line-height: 1; margin-left: 2px"
                  >Bỏ rương vàng treo</span
                >
              </label>
            </div>
          </div>

          <div class="field" id="div_accounts">
            <div class="sect-head">5 · Id follow idol</div>
            <label for="accounts">
              Những id follow idol
              <span class="count-pill" id="accounts_count"></span>
            </label>

            <textarea
              id="accounts"
              name="accounts"
              rows="5"
              placeholder=" id1, id2, ..."
              style="width: 100%"
            ></textarea>

            <div id="accounts_error" class="error"></div>
          </div>
        </div>

        <div class="actionbar">
          <div id="save_status" class="save-status"></div>
          <div class="actionbar-row">
            <button type="button" id="submitButton" class="saveButton">Lưu</button>
            <button type="button" id="restartButton" class="restartButton" title="Khởi động lại bot">
              <span class="restart-ico">⟳</span>
              <span class="restart-txt">Khởi động lại</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
